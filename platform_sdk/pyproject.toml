[project]
name = "ai-os-sdk"
version = "0.1.0"
description = "AI_OS Platform SDK — the only sanctioned interface between Capability Packs and the platform (platform_sdk.md). Packaging scaffold only; no Protocols, models, or errors yet (platform_sdk_v1_scope.md step 1)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# License: not yet decided at the project level — the identical open
# item already recorded in kernel/pyproject.toml and
# capability_packs/software-engineering/pyproject.toml. Do not set a
# `license` field here until the project owner decides one.
dependencies = [
    # Every boundary model this SDK will define is a Pydantic v2 model
    # (platform_sdk.md §2, design rule 3) — declared now, ahead of any
    # model existing, because a package with no runtime dependency at
    # all cannot import Pydantic to define one the moment step 2 lands.
    "pydantic>=2.7,<3.0",
    # ai_os_sdk.testing.waiver parses a pack's own check-7 waiver file
    # (platform_sdk_v1_scope.md step 8) — YAML, matching manifest.yaml's
    # own established declarative-config convention rather than
    # introducing a second one. Identical version range to the Kernel's
    # own pyyaml dependency (kernel/pyproject.toml), which parses the
    # same format for the same reason (manifest parsing).
    "pyyaml>=6.0,<7.0",
    # ai_os_sdk.testing.pack_contract_suite check 1 (manifest validity)
    # re-implements the exact schema-validation logic
    # ai_os_kernel.manifest_loader.ManifestLoader already runs in
    # production, against the same schema file — this package cannot
    # import that Kernel module (dependency-floor rule below), so it
    # depends on the same underlying library directly instead. Identical
    # version range to the Kernel's own jsonschema dependency
    # (kernel/pyproject.toml), which validates the same schema for the
    # same reason.
    "jsonschema>=4.23,<5.0",
    # check 1 also verifies a manifest's declared dependencies.sdkVersion
    # PEP 440 range against the real, installed ai-os-sdk version —
    # packaging.specifiers is the standard library for that comparison.
    "packaging>=24.0,<27.0",
]
# Design rule 1 (platform_sdk.md §2): "The SDK is the dependency floor.
# ai-os-sdk depends on no other AI_OS distribution." No ai-os-kernel,
# ai-os-pack-*, or ai-os-services entry belongs in this list, ever.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_os_sdk"]
