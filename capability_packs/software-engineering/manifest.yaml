# Software Engineering Capability Pack manifest.
#
# Validated against platform_sdk/schemas/manifest.schema.json by
# ai_os_kernel.manifest_loader.ManifestLoader — see this pack's own
# tests (tests/test_pack.py) for a real, executed proof.
#
# `performance` added 2026-08-09 (`P08-S01-M29-T07`) — see its own
# entry below for the real scope (static AST complexity, no LLM call).
# The header comment below this point is pre-existing, dated staleness
# ("now six agents") this step did not re-audit — 11 agents are real
# and declared here as of this addition; see `agents.md`'s own
# "Currently Implemented Subset" for the always-current count.
#
# This is the "Highest priority" pack capability_pack_contract.md's own
# "Current Priority Packs" table names — now six agents: Requirements
# Analyst (analyzes and refines a raw requirement, no design/code),
# Architecture (design proposal only, no code), Build (writes one real
# file through the sandbox from an LLM instruction), Lint (runs a real
# static-analysis tool against that file through the sandbox, reporting
# a real pass/fail — no LLM call at all), QA/Test (runs a real command
# against a real file through the sandbox, reporting a real pass/fail —
# no LLM call at all), and Documentation (calls an LLM to record what
# Build wrote and how QA/Test verified it, writing a real Markdown file
# through the same sandbox). All six agents are now chained into one
# real, declared workflow (`se.delivery_pipeline`): Requirements Analyst
# was proven independently first (2026-07-28), the identical "prove
# each agent alone first, chain later" sequencing every other agent in
# this pack's own history has followed, then wired in as the pipeline's
# own first step (2026-07-30). Lint (2026-07-30) is this pack's sixth
# agent and the first added since the Capability Pack growth gate
# lifted (2026-07-29) — added specifically to prove the Quality Gate
# Engine's own gate mechanism (built the same day, one step prior)
# genuinely generalizes to a second gate category (Static Analysis, not
# just Testing) via configuration, not a new mechanism; see
# `ai_os_kernel.workflow_engine.delivery_pipeline`'s own docstring.
# Every other documented agent category from
# docs/06_capability_packs/software_engineering/agents.md's own Agent
# Catalog (Technical Planning, Frontend Development, Database, API
# Design, DevOps, Security, Code Review, Release, Refactoring,
# Performance) is a distinct, later increment, not attempted here.
#
# **Agent id reconciliation (this step)**: `architect` -> `architecture`
# and `test` -> `qa-test` were renamed to match agents.md's own
# Approved, authoritative Agent Catalog exactly. `documentation` already
# matched. `build` has no documented counterpart in agents.md — its real
# scope (write exactly one generic file from an instruction) is
# deliberately narrower than `backend-developer`'s own documented scope
# ("Backend services and APIs") and does not fit any of the other 14
# documented agent ids either — agents.md's own Agent Catalog was
# amended to add `build` as a new, clearly-scoped entry rather than
# force-fitting or silently keeping an undocumented id; see agents.md's
# own "Currently Implemented Subset" section for the full reasoning.
# The QA/Test Agent's own entry below no longer declares a decoy
# `modelAlias` either — the schema itself was fixed the same step to
# require it only when an agent's own permissions declare `llm:invoke`.
#
# **`qualityGates:` now declares this pack's two real gate definitions
# (2026-08-05, `P02-S06-M15-T06`)** — `se.build_lint_clean`/
# `se.build_tests_pass`, the exact ids `workflows/delivery_pipeline.yaml`'s
# own top-level `qualityGates:` list already referenced before this step,
# with no real definition anywhere to back them. Each `entrypoint` points
# at the real agent class that actually performs the check today (the
# Lint/QA-Test Agent) — quality_gates_framework.md §4's own
# "evaluationMethod: how the gate is evaluated," not a standalone
# gate-evaluator class (none exists yet; Gate Executor is a separate,
# unbuilt component, `P02-S06-M15-T07`). `successCriteria` describes the
# one real mechanism that actually enforces these gates today
# (`ai_os_kernel.workflow_engine.quality_gate.QualityGateStepExecutor`
# reading the configured source step's own real `passed` field) — schema
# only, nothing resolves/invokes this `entrypoint` yet, the identical
# "schema only, nothing reads this column yet" precedent
# `catalog.agents.entrypoint`/`catalog.tools.entrypoint` already
# establish.

apiVersion: ai-os/v1
kind: CapabilityPack

metadata:
  id: software-engineering
  name: Software Engineering Pack
  version: 0.1.0
  description: >-
    Autonomous software engineering capabilities. The Requirements
    Analyst Agent analyzes and refines a raw requirement (no design, no
    code); the Architecture Agent proposes a design (no code); the
    Build Agent turns a design or instruction into one real file,
    written through the sandbox; the Lint Agent runs a real
    static-analysis tool against that file through the sandbox and
    reports a real pass/fail; the QA/Test Agent runs a real command
    against that file through the sandbox and reports a real
    pass/fail; the Documentation Agent calls an LLM to record what was
    built and how it was verified, writing a real Markdown file through
    the same sandbox. All six agents are chained into one real,
    declared workflow (`se.delivery_pipeline`).
  owner: platform-team
  license: UNLICENSED

compatibility:
  minKernelVersion: 0.1.0

dependencies:
  sdkVersion: ">=0.1.0,<1.0.0"

permissions:
  - llm:invoke
  - sandbox:execute
  - git:write

entryPoint: ai_os_pack_software_engineering.pack:SoftwareEngineeringPack

agents:
  - id: requirements-analyst
    name: Requirements Analyst Agent
    version: 0.1.0
    purpose: >-
      Given a raw software requirement or ask as input, produce a
      structured, refined requirements analysis as output — no
      architecture design, no code generation.
    entrypoint: ai_os_pack_software_engineering.agents.requirements_analyst:RequirementsAnalystAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.requirements_analyst:RequirementsAnalysisInput
    outputSchema: ai_os_pack_software_engineering.agents.requirements_analyst:RequirementsAnalysisOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
    requiredPrompts:
      - requirements.analyze@0.1.0

  - id: architecture
    name: Architecture Agent
    version: 0.1.0
    purpose: >-
      Given a software requirement or specification as input, propose a
      concrete technical architecture and design as output. Produces a
      design proposal only — no code generation.
    entrypoint: ai_os_pack_software_engineering.agents.architecture:ArchitectureAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.architecture:ArchitectureProposalInput
    outputSchema: ai_os_pack_software_engineering.agents.architecture:ArchitectureProposalOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
    requiredPrompts:
      - architecture.propose_design@0.1.0

  - id: build
    name: Build Agent
    version: 0.1.0
    purpose: >-
      Given a design or instruction, produce one concrete file
      implementing it and genuinely write it to disk through the
      sandbox — the first real link between an LLM-produced instruction
      and sandboxed execution.
    entrypoint: ai_os_pack_software_engineering.agents.build:BuildAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.build:BuildInstructionInput
    outputSchema: ai_os_pack_software_engineering.agents.build:BuildAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - build.write_file@0.1.0

  - id: lint
    name: Lint Agent
    version: 0.1.0
    purpose: >-
      Given a file the Build Agent wrote, genuinely run a real
      static-analysis check (python -m py_compile — a stdlib syntax
      check, chosen over ruff after ruff was found to genuinely fail
      against DockerSandbox's own default image, which has no ruff
      installed) against it inside the sandbox and report the real
      pass/fail outcome — derived only from the tool's own exit code,
      never from an LLM's opinion. This pack's sixth agent, and the
      first added since the Capability Pack growth gate lifted
      (2026-07-29).
    entrypoint: ai_os_pack_software_engineering.agents.lint:LintAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.lint:LintAgentInput
    outputSchema: ai_os_pack_software_engineering.agents.lint:LintAgentOutput
    # No modelAlias — this agent makes no LLM call at all, the identical
    # shape qa-test's own entry below already establishes for the same
    # reason.
    permissions:
      - sandbox:execute

  - id: qa-test
    name: QA/Test Agent
    version: 0.1.0
    purpose: >-
      Given a file the Build Agent wrote and the command that runs it,
      genuinely execute that command inside the sandbox and report the
      real pass/fail outcome — derived only from the actual process
      exit code, never from an LLM's opinion of the output.
    entrypoint: ai_os_pack_software_engineering.agents.verification:TestAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.verification:TestAgentInput
    outputSchema: ai_os_pack_software_engineering.agents.verification:TestAgentOutput
    # No modelAlias — this agent makes no LLM call at all (see
    # agents/verification.py's own docstring). Previously a required,
    # genuinely-unused decoy value was declared here to satisfy the
    # manifest schema's own unconditional requirement; the schema was
    # fixed (2026-07-28, platform_sdk/schemas/manifest.schema.json) to
    # require modelAlias only when this agent's own permissions declare
    # llm:invoke, so the decoy value is removed rather than kept.
    permissions:
      - sandbox:execute

  - id: documentation
    name: Documentation Agent
    version: 0.1.0
    purpose: >-
      Given a Build Agent result and its Test Agent outcome, call an
      LLM to produce a concise Markdown record of what was built, why,
      how it was verified, and its current status — then genuinely
      write it to disk through the sandbox, for future LLM context.
    entrypoint: ai_os_pack_software_engineering.agents.documentation:DocumentationAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.documentation:DocumentationAgentInput
    outputSchema: ai_os_pack_software_engineering.agents.documentation:DocumentationAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - documentation.record_artifact@0.1.0

  - id: database
    name: Database Agent
    version: 0.1.0
    purpose: >-
      Given a design or instruction (FR-036), produce one reversible SQL
      migration file (a "-- UP"/"-- DOWN" pair) and genuinely write it
      through the sandbox. This pack's eighth agent, and the first new
      agent added since the module-27 Platform SDK hard gate lifted for
      real new agents, not a migration of an existing one.
    entrypoint: ai_os_pack_software_engineering.agents.database:DatabaseAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.database:DatabaseMigrationInput
    outputSchema: ai_os_pack_software_engineering.agents.database:DatabaseAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - database.write_migration@0.1.0

  - id: api-designer
    name: API Designer Agent
    version: 0.1.0
    purpose: >-
      Given a design or instruction (FR-037), produce one valid OpenAPI
      3.1 contract document and genuinely write it through the sandbox
      — validated against the real OpenAPI 3.1 specification before any
      write, never a hand-rolled structural check. This pack's ninth
      agent, and the second genuinely new agent (not a migration) since
      the module-27 Platform SDK hard gate lifted.
    entrypoint: ai_os_pack_software_engineering.agents.api_designer:ApiDesignerAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.api_designer:ApiContractInput
    outputSchema: ai_os_pack_software_engineering.agents.api_designer:ApiDesignerAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - apidesigner.write_contract@0.1.0

  - id: security-analysis
    name: Security Analysis Agent
    version: 0.1.0
    purpose: >-
      Given a file the Build Agent wrote (FR-040), genuinely scan it
      inside the sandbox for a small, well-known set of real,
      AST-precise security patterns (eval/exec, subprocess
      shell=True, unsafe pickle/yaml deserialization) and report the
      real pass/fail outcome with structured findings — derived only
      from the scan script's own exit code, never from an LLM's
      opinion. This pack's tenth agent, and the third genuinely new
      agent (not a migration) since the module-27 Platform SDK hard
      gate lifted.
    entrypoint: ai_os_pack_software_engineering.agents.security_analysis:SecurityAnalysisAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.security_analysis:SecurityAnalysisInput
    outputSchema: ai_os_pack_software_engineering.agents.security_analysis:SecurityAnalysisOutput
    # No modelAlias — this agent makes no LLM call at all, the identical
    # shape lint's/qa-test's own entries already establish.
    permissions:
      - sandbox:execute

  - id: release
    name: Release Agent
    version: 0.1.0
    purpose: >-
      Given a Build Agent result and its QA/Test Agent outcome
      (FR-042), record a changelog entry with a proposed version bump
      and a real, mechanically-derived release-readiness verdict
      (`ready`, equal to the Test Agent's own `passed` — never an
      LLM's opinion) — then genuinely write the changelog through the
      sandbox. This pack's eleventh agent, and the fourth genuinely
      new agent (not a migration) since the module-27 Platform SDK
      hard gate lifted.
    entrypoint: ai_os_pack_software_engineering.agents.release:ReleaseAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.release:ReleaseAgentInput
    outputSchema: ai_os_pack_software_engineering.agents.release:ReleaseAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - release.record_changelog@0.1.0

  - id: code-review
    name: Code Reviewer Agent
    version: 0.1.0
    purpose: >-
      Given a file the Build Agent wrote (FR-039, MUST), review it for
      correctness, readability, and standards issues, producing real
      structured findings (file, line, severity, confidence) — the
      first agent in this pack's own "code analysis" family to
      deliberately use an LLM's judgment as the whole point, since
      `confidence` is inherently a model judgment no mechanical tool
      computes. This pack's twelfth agent, and the fifth genuinely new
      agent (not a migration) since the module-27 Platform SDK hard
      gate lifted.
    entrypoint: ai_os_pack_software_engineering.agents.code_review:CodeReviewerAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.code_review:CodeReviewInput
    outputSchema: ai_os_pack_software_engineering.agents.code_review:CodeReviewerAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - codereview.produce_findings@0.1.0

  - id: technical-planner
    name: Technical Planner Agent
    version: 0.1.0
    purpose: >-
      Given a technical design (the Architecture Agent's own output),
      decompose it into a real, schema-validated plan artifact — this
      pack's first implementation of ADR-0021's own sanctioned
      "dynamic decomposition without dynamic control flow" mechanism.
      No `foreach` step exists anywhere in the Workflow Engine yet to
      consume this artifact (`StepType` has seven members, not the
      nine ADR-0021 describes) — a disclosed Workflow Engine gap, not
      a defect in this agent; the identical "build real, wire later"
      precedent this pack's own Evaluation Engine work already
      established this session.
    entrypoint: ai_os_pack_software_engineering.agents.technical_planner:TechnicalPlannerAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.technical_planner:TechnicalPlanInput
    outputSchema: ai_os_pack_software_engineering.agents.technical_planner:TechnicalPlanOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
    requiredPrompts:
      - technicalplanning.produce_plan@0.1.0

  - id: frontend-developer
    name: Frontend Developer Agent
    version: 0.1.0
    purpose: >-
      Given a plan task or instruction (FR-035), produce one frontend
      component file and genuinely write it through the sandbox — the
      real, catalog-documented identity `se.implement_task`'s own
      `task.kind`-routed graph names ("frontend-developer... by
      task.kind"). Reuses build.py's/database.py's/api_designer.py's
      own write mechanism verbatim; the one real addition is a
      frontend-file-extension precondition, enforced before any
      sandbox call.
    entrypoint: ai_os_pack_software_engineering.agents.frontend_developer:FrontendDeveloperAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.frontend_developer:FrontendComponentInput
    outputSchema: ai_os_pack_software_engineering.agents.frontend_developer:FrontendDeveloperAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - frontenddeveloper.write_component@0.1.0

  - id: refactoring
    name: Refactoring Agent
    version: 0.1.0
    purpose: >-
      Given an existing file and its own real test command (FR-043),
      refactor it without changing observable behaviour — the only
      agent in this pack that runs a real before/after test comparison
      for a single file, since FR-043's own criterion ("tests pass
      before and after") has no other component that could enforce it.
      Refuses before any LLM call or write if the baseline itself does
      not pass; "behaviour assertions unchanged" holds structurally,
      since this agent never touches a test file.
    entrypoint: ai_os_pack_software_engineering.agents.refactoring:RefactoringAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.refactoring:RefactoringInput
    outputSchema: ai_os_pack_software_engineering.agents.refactoring:RefactoringAgentOutput
    modelAlias: coding-strong
    permissions:
      - llm:invoke
      - sandbox:execute
    requiredPrompts:
      - refactoring.rewrite_file@0.1.0

  - id: git-push
    name: Git Push Agent
    version: 0.1.0
    purpose: >-
      Given the file Build wrote, genuinely commit and push it through
      the real Git Integration Service, reached exclusively through
      ToolInvoker (platform.git.commit/platform.git.push) — never a
      direct Kernel import. Degrades to a real, structured no-op when
      no remote_url is configured (no real, non-hardcoded default
      exists), the identical "absent means unaffected" shape every
      other optional Workflow Engine capability already establishes.
      This pack's seventh agent, and the first added since the
      Capability Pack growth gate lifted (2026-07-29) that consumes a
      Platform Service.
    entrypoint: ai_os_pack_software_engineering.agents.git_push:GitPushAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.git_push:GitPushAgentInput
    outputSchema: ai_os_pack_software_engineering.agents.git_push:GitPushAgentOutput
    # No modelAlias — this agent makes no LLM call at all, the identical
    # shape qa-test's/lint's own entries above already establish.
    permissions:
      - sandbox:execute
      - git:write

  - id: performance
    name: Performance Agent
    version: 0.1.0
    purpose: >-
      Given one real source file, genuinely compute real McCabe
      cyclomatic complexity per function from its own AST (stdlib
      ast — no LLM call at all, the identical shape lint's/qa-test's
      own entries above establish) and report real hotspots plus
      mechanically-derived recommendations for any function crossing
      the real, named threshold of 10. "A running system" (FR-044's
      own Input) reduced honestly to one real static file — no real
      APM/instrumentation infrastructure exists anywhere in this
      codebase to attach to a genuinely running process.
    entrypoint: ai_os_pack_software_engineering.agents.performance:PerformanceAgentEntrypoint
    inputSchema: ai_os_pack_software_engineering.agents.performance:PerformanceAgentInput
    outputSchema: ai_os_pack_software_engineering.agents.performance:PerformanceAgentOutput
    # No modelAlias — this agent makes no LLM call at all.
    permissions:
      - sandbox:execute

tools:
  - id: fs.read
    name: File Read Tool
    version: 0.1.0
    description: >-
      Reads a real file's content through a real, directly-injected
      sandbox (P03-S04-M31-T02) — the first real, manifest-declared,
      registry-resolvable Tool this codebase has ever had. Invoked via
      an agent's own context.tools.invoke("fs.read", inputs); not yet
      adopted by any agent (deferred, matching this pack's own
      established "prove standalone first" precedent).
    entrypoint: ai_os_pack_software_engineering.tools.fs_read:FsReadToolEntrypoint
    inputSchema: ai_os_pack_software_engineering.tools.fs_read:FsReadInput
    outputSchema: ai_os_pack_software_engineering.tools.fs_read:FsReadOutput
    trustTier: tier1_sandboxed
    permissions:
      - sandbox:execute

  - id: build.run
    name: Build Run Tool
    version: 0.1.0
    description: >-
      Runs a real, per-invocation-parameterized command through a real,
      directly-injected sandbox (P03-S04-M31-T02) — proves a second,
      pack-owned, catalog-resolved tool_id reaches a real sandbox end to
      end, genuinely reusable across arbitrarily many commands (unlike
      SandboxedCommandTool's own fixed-at-construction shape). Not yet
      adopted by any agent (deferred, matching this pack's own
      established "prove standalone first" precedent).
    entrypoint: ai_os_pack_software_engineering.tools.build_run:BuildRunToolEntrypoint
    inputSchema: ai_os_pack_software_engineering.tools.build_run:BuildRunInput
    outputSchema: ai_os_pack_software_engineering.tools.build_run:BuildRunOutput
    trustTier: tier1_sandboxed
    permissions:
      - sandbox:execute

workflows:
  - id: se.delivery_pipeline
    name: Software Delivery Pipeline
    version: 1.9.0
    description: >-
      Chains Requirements Analyst, Architecture, Build, Lint, Code
      Review, QA/Test, Documentation, and Git Push into one real,
      declared workflow — each step's genuine output reaches the next
      step's genuine input through a real Context Manager resolver. A
      real decision step routes straight to Test (skipping a wasted
      Lint and Code Review invocation) when Build's own write
      genuinely failed. Three real, blocking, bounded-retry Quality
      Gates now exist: one reading Lint's own outcome (Static
      Analysis), one reading Code Review's own outcome (FR-045's own
      bounded review-revise loop, blocking on a genuine `high`
      severity finding), one reading Test's own outcome (Testing).
      A real Human Approval Point (`approve-git-push`) now pauses the
      pipeline before its final step — a real, attributable, authorized
      decision is required to proceed, never a timeout. Git Push then
      genuinely commits and pushes through the real Git Integration
      Service when configured with a real remote — a real, structured
      no-op otherwise. An optional `specification` input (FR-030,
      `P03-S03-M30-T02`) lets a caller additionally supply a structured
      Markdown spec, parsed into validated requirement items that
      Requirements Analyst folds into its own context — `requirement`
      stays required and unchanged, so every existing caller is
      unaffected.
    definition: workflows/delivery_pipeline.yaml
    inputsSchema: ai_os_pack_software_engineering.workflows.models:PipelineInput
    outputsSchema: ai_os_pack_software_engineering.workflows.models:PipelineOutput
    permissions:
      - llm:invoke
      - sandbox:execute
      - git:write
    trigger: manual

qualityGates:
  - id: se.build_lint_clean
    name: Build Lint Clean
    version: 0.1.0
    description: >-
      Static analysis (python -m py_compile) passes with zero findings
      against the file the Build Agent wrote.
    entrypoint: ai_os_pack_software_engineering.agents.lint:LintAgentEntrypoint
    severity: blocking
    successCriteria: >-
      The source step's own real `passed` field is `True`.

  - id: se.build_tests_pass
    name: Build Tests Pass
    version: 0.1.0
    description: >-
      The real test command the QA/Test Agent runs against the file
      the Build Agent wrote exits zero, with no failures.
    entrypoint: ai_os_pack_software_engineering.agents.verification:TestAgentEntrypoint
    severity: blocking
    successCriteria: >-
      The source step's own real `passed` field is `True`.

  - id: se.code_review_clean
    name: Code Review Clean
    version: 0.1.0
    description: >-
      The Code Reviewer Agent finds no `high` severity issue in the
      file the Build Agent wrote (FR-045's own bounded review-revise
      loop) — `medium`/`low` findings are real but advisory, never
      blocking.
    entrypoint: ai_os_pack_software_engineering.agents.code_review:CodeReviewerAgentEntrypoint
    severity: blocking
    successCriteria: >-
      The source step's own real `passed` field is `True`.

prompts:
  - id: requirements.analyze
    version: 0.1.0
    location: prompts/requirements_analysis.md
    inputSchema: ai_os_pack_software_engineering.agents.requirements_analyst:RequirementsAnalysisInput
    description: >-
      Instructs the model to analyze and refine a raw software
      requirement into a structured requirements analysis — no
      architecture design, no code.

  - id: architecture.propose_design
    version: 0.1.0
    location: prompts/architecture_proposal.md
    inputSchema: ai_os_pack_software_engineering.agents.architecture:ArchitectureProposalInput
    description: >-
      Instructs the model to propose a concrete technical architecture
      for a given software requirement — design proposal only, no code.

  - id: build.write_file
    version: 0.1.0
    location: prompts/build_write_file.md
    inputSchema: ai_os_pack_software_engineering.agents.build:BuildInstructionInput
    description: >-
      Instructs the model to produce exactly one file (path + content)
      implementing a given design/instruction, in a fixed, parseable
      format with no surrounding prose.

  - id: database.write_migration
    version: 0.1.0
    location: prompts/database_write_migration.md
    inputSchema: ai_os_pack_software_engineering.agents.database:DatabaseMigrationInput
    description: >-
      Instructs the model to produce exactly one reversible SQL
      migration file (a "-- UP"/"-- DOWN" pair) implementing a given
      design/instruction, in a fixed, parseable format with no
      surrounding prose.

  - id: apidesigner.write_contract
    version: 0.1.0
    location: prompts/api_designer_write_contract.md
    inputSchema: ai_os_pack_software_engineering.agents.api_designer:ApiContractInput
    description: >-
      Instructs the model to produce exactly one valid OpenAPI 3.1
      contract document implementing a given design/instruction, in a
      fixed, parseable format with no surrounding prose.

  - id: release.record_changelog
    version: 0.1.0
    location: prompts/release_record_changelog.md
    inputSchema: ai_os_pack_software_engineering.agents.release:ReleaseAgentInput
    description: >-
      Instructs the model to produce a concise changelog entry with a
