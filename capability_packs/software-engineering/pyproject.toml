[project]
name = "ai-os-pack-software-engineering"
version = "0.1.0"
description = "AI_OS Software Engineering Capability Pack — Architecture Agent (first real increment)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# License: not yet decided at the project level — see manifest.yaml's
# own `metadata.license: UNLICENSED` and kernel/pyproject.toml's
# identical open item. Do not set a `license` field here until the
# project owner decides one.
dependencies = [
    "pydantic>=2.7,<3.0",
    # The only real runtime dependency beyond pydantic, as of
    # platform_sdk_v1_scope.md step 14: every agent and pack.py itself
    # depend solely on ai_os_sdk types. The prior "ai-os-kernel" runtime
    # dependency this list carried since before that step (a documented,
    # temporary compromise while the Platform SDK did not yet exist) is
    # removed here — a real, discovered gap: step 14's own migration
    # made ai_os_kernel unreachable from this pack's src/ tree, but never
    # updated this file to match, so the built wheel kept over-declaring
    # a dependency it no longer imports. ai-os-kernel remains available
    # in this workspace's shared dev venv (root pyproject.toml's own
    # dependencies list installs every member unconditionally) for this
    # pack's own tests/, which still legitimately use real Kernel-side
    # test doubles (EchoLLMGateway, InMemoryPromptEngine,
    # LocalSubprocessSandbox, DockerSandbox) — it simply no longer
    # belongs in this pack's own published runtime dependency list.
    "ai-os-sdk",
    # api_designer.py's own real, standards-grade validation of an
    # LLM-produced OpenAPI 3.1 document (FR-037: "produced and
    # validated") — chosen over a hand-rolled structural check
    # (product-owner decision, 2026-08-06) precisely because a real
    # spec validator catches genuine OpenAPI violations a few
    # top-level-key checks would miss.
    "openapi-spec-validator>=0.7,<1.0",
    # pyyaml is already a real, transitive dependency via ai-os-sdk's
    # own pyproject.toml (platform_sdk/pyproject.toml) — declared
    # directly here too, since api_designer.py imports it directly,
    # not merely relying on a dependency's own dependency.
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_os_pack_software_engineering"]
