# se.product_creation (P08-S02-M30-T01) — workflows.md §3's own
# documented "Full Product Creation" graph, steps 1-8 of 14.
#
# **Step 8 is real as of 2026-08-09 — `StepType.FOREACH`/
# `ForeachStepExecutor` now exist** (this same ticket): `foreach`
# genuinely reads `technical-planner`'s own real, persisted `tasks`
# list and fans out one real child `se.implement_task` instance per
# item, bounded by the real `maxFanOut` below. Steps 9-14 (nine
# parallel quality gates, documentation, release, and the final PR)
# remain genuinely unbuilt here — a real, disclosed scope limit, the
# identical "build real, wire later" precedent this session already
# established for technical-planner's own agent half; this step's own
# scope is exactly "give the plan artifact its first real consumer,"
# not the full documented graph.
#
# **`se.implement_task`'s own `inputs` schema was widened to make this
# real** (`implement_task.yaml`'s own header comment has the full
# reasoning): `technical-planner`'s own real plan-item shape
# (`taskId`/`title`/`description`) did not satisfy that workflow's own
# prior `{task: string}` contract, a genuine mismatch between two
# independently-built, already-`done` tickets found only once a real
# `foreach` step tried to connect them. Product-owner decision
# (`AskUserQuestion`): widen the consumer's schema to match the real
# producer, rather than inventing a per-item field-mapping mechanism in
# the `foreach` contract itself for a need seen exactly once so far.
#
# Steps 1-7 need no such gap: `requirements-analyst`, `architecture`,
# and `technical-planner` are all real, already-built, `done` agents
# (`P03-S02-M29-T07`'s own row confirms `technical-planner` itself,
# separately from `foreach`, is real); `agent`/`quality_gate`/
# `human_approval` are all real step types this pack's own
# `delivery_pipeline.yaml` already proves end to end.
#
# The two `quality_gate` steps below (`quality-gate-requirements-complete`/
# `quality-gate-architecture-compliance`) are real, genuine `quality_gate`
# steps — but this workflow's own composition
# (`ai_os_kernel.workflow_engine.product_creation`) does not configure a
# real source step for either, since neither `requirements-analyst` nor
# `architecture`'s own real output schema has a pass/fail-shaped field
# to read (both are free-text `analysis`/`content` strings — verified
# directly, not assumed). `QualityGateStepExecutor`'s own documented
# behavior for an unconfigured gate id is a real, honest pass with
# empty outputs (the identical "an unconfigured step contributes/blocks
# nothing" shape `WorkflowStepOutputResolver` already establishes) — a
# disclosed no-op today, not a fabricated pass/fail signal, and not a
# lie about what real checking is happening.
#
# Step ids below are this workflow's own local naming, independent of
# the agent catalog's own ids — the identical convention
# `delivery_pipeline.yaml`'s own header comment already establishes.
#
# **`version: 0.2.0`** (bumped from `0.1.0` for the new step 8) — still
# not `1.0.0`, matching this pack's own initial versioning convention
# (every prompt this workflow invokes is pinned `@0.1.0` too), and also
# avoids a real, discovered collision:
# `tests/integration/workflow_engine/conftest.py`'s own autouse fixture
# seeds a placeholder `catalog.workflow_definitions` row pinned to the
# exact composite key `("se.product_creation", "1.0.0")`, used across
# ~20 unrelated tests as an arbitrary "some definition exists" FK
# target that predates this real workflow. Reusing that exact
# `(id, version)` pair here would make this real definition's own
# `register()` silently lose an `ON CONFLICT DO NOTHING` race to that
# placeholder's empty `graph`, in this package's own tests specifically.
# A different version keeps the composite key distinct, so the real
# definition here and that fixture's placeholder never collide.

id: se.product_creation
name: Product Creation (Requirements Through Plan)
description: >-
  Requirements Analyst refines the raw specification, a real Quality
  Gate checkpoint and a real Human Approval Point gate progress before
  Architecture ever runs, Architecture proposes a design against the
  refined requirements, a second real Quality Gate checkpoint and
  Human Approval Point gate progress before planning begins, Technical
  Planner decomposes the approved design into a real, persisted plan
  artifact, and a real `foreach` step fans that plan out into one real
  `se.implement_task` run per task — the real, buildable prefix of
  workflows.md §3's own documented graph (steps 1-8 of 14; see this
  file's own header comment for exactly which real gap stopped it
  short of that before, and how it was resolved).
version: 0.2.0
trigger: manual

inputs:
  type: object
  properties:
    specification:
      type: string
      description: >-
        The structured specification to turn into working software —
        Requirements Analyst's own real input, read via the Context
        Manager's `WorkflowStateResolver` exactly as
        `delivery_pipeline.yaml`'s own `requirement` input already is.
  required: [specification]
  additionalProperties: false

outputs:
  type: object
  properties:
    implementationPlanRef:
      type: string
  required: [implementationPlanRef]
  additionalProperties: false

agents:
  - software-engineering/requirements-analyst
  - software-engineering/architecture
  - software-engineering/technical-planner

qualityGates:
  - se.requirements_complete
  - se.architecture_compliance

humanApprovalPoints:
  - id: approve-requirements
    name: Approve Requirements
    description: >-
      A human must confirm the refined requirements are correct and
      complete before Architecture ever designs against them
      (workflows.md §3, step 3 — FR-111's own governance line).
    context:
      step: requirements-analyst
      reads: [requirements-analyst.analysis]
    options: [approve, reject]

  - id: approve-architecture
    name: Approve Architecture
    description: >-
      A human must approve the proposed design before any
      implementation planning begins (workflows.md §3, step 6).
    context:
      step: architecture
      reads: [architecture.content]
    options: [approve, reject]

failureHandling:
  onError: halt

steps:
  - id: requirements-analyst
    type: agent
    agentId: software-engineering/requirements-analyst
    promptId: requirements.analyze
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: quality-gate-requirements-complete
    type: quality_gate

  - id: approve-requirements
    type: human_approval

  - id: architecture
    type: agent
    agentId: software-engineering/architecture
    promptId: architecture.propose_design
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: quality-gate-architecture-compliance
    type: quality_gate

  - id: approve-architecture
    type: human_approval

  - id: technical-planner
    type: agent
    agentId: software-engineering/technical-planner
    promptId: technicalplanning.produce_plan
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: implement-tasks
    type: foreach
    subWorkflowId: se.implement_task
    foreach:
      sourceStepId: technical-planner
      itemsField: tasks
      # A named, documented first-cut bound (ADR-0021: "foreach
      # declares a maximum fan-out"), not tuned to any real observed
      # plan size — no document names a real task-count ceiling for a
      # single product-creation run, so this is a generous, disclosed
      # placeholder headroom value, the identical "safety limit, not
      # yet tuned" carve-out `technical_planner.py`'s own
      # `_MAX_OUTPUT_TOKENS` already uses.
      maxFanOut: 20
