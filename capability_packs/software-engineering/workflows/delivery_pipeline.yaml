# Chains this pack's own five independently-proven agents — Requirements
# Analyst, Architecture, Build, QA/Test, Documentation (manifest agent
# ids: `requirements-analyst`, `architecture`, `build`, `qa-test`,
# `documentation`) — into one real, declared Workflow Engine pipeline.
# Each step's genuine output reaches the next step's genuine input
# through ai_os_kernel.context_manager.resolvers.WorkflowStepOutputResolver
# (a Context Manager resolver, not a new orchestration mechanism) —
# see ai_os_pack_software_engineering.pipeline's own docstring for the
# full composition.
#
# Requirements Analyst is now this pipeline's own first step
# (previously proven independently, not chained in — see
# tests/integration/_delivery_pipeline.py's own docstring for the real
# hand-off this adds): a caller's raw `requirement` reaches Requirements
# Analyst first, and Architecture now designs against Requirements
# Analyst's own real, refined output — not the raw requirement directly
# any more.
#
# Step ids below (`requirements-analyst`/`architecture`/`build`/`test`/
# `quality-gate-tests-pass`/`documentation`) are workflow-local
# identifiers, independent of the agent catalog's own ids — the `test`
# step id was deliberately left unchanged even though the agent it
# invokes was renamed to `qa-test`, since step ids are this workflow's
# own naming, not a copy of the agent catalog.
#
# `quality-gate-tests-pass` (added 2026-07-30) is a real, blocking
# quality_gate step — the smallest real slice of the Quality Gate
# Engine (see ai_os_kernel.workflow_engine.quality_gate's own
# docstring). It reads the `test` step's own real, persisted `passed`
# field and halts the pipeline (Documentation never runs) when it is
# not `True` — which prior step it reads is composition-level config in
# ai_os_kernel.workflow_engine.delivery_pipeline, not a field declared
# here (see that module's own `_GATE_SOURCES`).
#
# Loaded by the already-real, already-existing, previously-unused
# ai_os_kernel.workflow_engine.loader.WorkflowDefinitionLoader — the
# first real consumer of that loader in this codebase (every prior
# WorkflowDefinition in this project, including kernel/bootstrap.py's
# own demo, is constructed directly in Python, for the documented
# reason that no real pack directory existed yet to load one from —
# see bootstrap.py's own comment. One now does.)

id: se.delivery_pipeline
name: Software Delivery Pipeline
description: >-
  Requirements Analyst refines the raw ask, Architecture proposes a
  design against that refined analysis, Build implements it, Test
  verifies it, a real Quality Gate blocks on a genuine test failure,
  Documentation records it — five real agent steps plus one real,
  blocking quality gate, each genuinely consuming the previous step's
  real, persisted output.
version: 1.2.0
trigger: manual

inputs:
  type: object
  properties:
    requirement:
      type: string
      description: >-
        The raw software requirement or ask to design, build, test, and
        document — analyzed and refined by Requirements Analyst before
        Architecture ever sees it.
  required: [requirement]
  additionalProperties: false

outputs:
  type: object
  properties:
    documentationPath:
      type: string
  required: [documentationPath]
  additionalProperties: false

agents:
  - software-engineering/requirements-analyst
  - software-engineering/architecture
  - software-engineering/build
  - software-engineering/qa-test
  - software-engineering/documentation

qualityGates:
  - se.build_tests_pass

failureHandling:
  onError: halt

steps:
  - id: requirements-analyst
    type: agent
    agentId: software-engineering/requirements-analyst
    promptId: requirements.analyze
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: architecture
    type: agent
    agentId: software-engineering/architecture
    promptId: architecture.propose_design
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: build
    type: agent
    agentId: software-engineering/build
    promptId: build.write_file
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: test
    type: agent
    agentId: software-engineering/qa-test

  - id: quality-gate-tests-pass
    type: quality_gate

  - id: documentation
    type: agent
    agentId: software-engineering/documentation
    promptId: documentation.record_artifact
    promptVersion: 0.1.0
    modelAlias: coding-strong
