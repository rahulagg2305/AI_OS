# Chains this pack's own independently-proven agents — Requirements
# Analyst, Architecture, Build, Lint, Code Review, QA/Test,
# Documentation (manifest agent ids: `requirements-analyst`,
# `architecture`, `build`, `lint`, `code-review`, `qa-test`,
# `documentation`) — into one real, declared Workflow Engine
# pipeline. Each step's genuine output reaches the next step's genuine
# input through ai_os_kernel.context_manager.resolvers.WorkflowStepOutputResolver
# (a Context Manager resolver, not a new orchestration mechanism) —
# see ai_os_pack_software_engineering.pipeline's own docstring for the
# full composition.
#
# Requirements Analyst is now this pipeline's own first step
# (previously proven independently, not chained in — see
# tests/integration/_delivery_pipeline.py's own docstring for the real
# hand-off this adds): a caller's raw `requirement` reaches Requirements
# Analyst first, and Architecture now designs against Requirements
# Analyst's own real, refined output — not the raw requirement directly
# any more.
#
# Step ids below (`requirements-analyst`/`architecture`/`build`/
# `quality-gate-lint-clean`/`code-review`/`quality-gate-code-review-clean`/
# `test`/`quality-gate-tests-pass`/`documentation`) are workflow-local
# identifiers, independent of the agent catalog's own ids — the `test`
# step id was deliberately left unchanged even though the agent it
# invokes was renamed to `qa-test`, since step ids are this workflow's
# own naming, not a copy of the agent catalog.
#
# Four real, blocking quality_gate steps now exist (the third,
# `quality-gate-code-review-clean`, added `P03-S03-M30-T03`) — the
# smallest real slices of the Quality Gate Engine (see
# ai_os_kernel.workflow_engine.quality_gate's own docstring), each
# reading a named prior step's own real, persisted `passed` field and
# halting the pipeline when it is not `True`. Which prior step each
# gate reads is composition-level config in
# ai_os_kernel.workflow_engine.delivery_pipeline, not a field declared
# here (see that module's own `_GATE_SOURCES`):
#
# - `quality-gate-lint-clean` (added 2026-07-30, this pipeline's second
#   gate, proving the mechanism genuinely generalizes beyond Testing to
#   a second category, Static Analysis) sits between `build` and `test`
#   — cheap static checks run before the more expensive sandboxed test
#   execution, matching quality_gates_framework.md §5's own documented
#   category order (5.1 Build, 5.2 Static Analysis, 5.3 Testing). It
#   reads the new `lint` step's own real `passed` field.
# - `quality-gate-code-review-clean` (added `P03-S03-M30-T03`, FR-045's
#   own bounded review-revise loop) sits between `quality-gate-lint-clean`
#   and `test` — reads the new `code-review` step's own real `passed`
#   field, mechanically derived from whether any finding's own severity
#   is `high` (`medium`/`low` findings are real but advisory, never
#   blocking — see ai_os_pack_software_engineering.agents.code_review's
#   own docstring). This is the third quality gate category this same,
#   unchanged mechanism now proves generalizes to, with zero changes to
#   `QualityGateStepExecutor` itself — only this module's own
#   `_GATE_SOURCES`/`_GATE_IDS`/`_STEP_RETRY_TARGETS` mappings grew.
# - `quality-gate-tests-pass` (added 2026-07-30, earlier the same day)
#   sits between `test` and `documentation`, reading `test`'s own real
#   `passed` field.
#
# `retryPolicy` below (added 2026-07-30) bounds a real retry when any
# gate fails: up to 2 total attempts, and no more than 60 real seconds
# spent retrying, before the pipeline genuinely halts — see
# ai_os_kernel.workflow_engine.delivery_pipeline's own `_GATE_RETRY_TARGETS`
# for which step each failed gate retries from (all three retry from
# `build` — see that constant's own comment for why), and
# WorkflowAdvanceRunner.run_to_completion's own docstring for the
# mechanism. This field already existed and was already validated
# (bounded attempts + bounded duration, per error_handling_retry.md §4)
# before the first gate read it at runtime. **A real, disclosed,
# pre-existing gap, not introduced or worsened here**: FR-045 itself
# also names a "token ceiling" bound; no workflow anywhere in this
# codebase enforces one today (`WorkflowInstance.total_tokens` is
# tracked, never checked against any ceiling) — this loop is bounded
# by attempts and duration only, the identical bound every other gate
# in this pipeline already has, not a narrower guarantee invented for
# this one.
#
# A real `decision` step (added 2026-08-02, `P02-S01-M05-T15`) now
# routes around `lint`/`quality-gate-lint-clean`/`code-review`/
# `quality-gate-code-review-clean` entirely when `build`'s own real
# `written` field is `false` — the write genuinely failed (nonzero exit
# or timeout, ai_os_pack_software_engineering.agents.build's own
# docstring), so there is nothing real for Lint or Code Review to
# check; routing straight to `test` instead skips two real, wasted
# invocations (and their own gate/retry-triggering) rather than blindly
# checking a file that was never written. `test` still runs either
# way — genuinely failing fast against the missing file, caught by the
# existing, unchanged `quality-gate-tests-pass` halt/retry, so
# `documentation`'s own `["build", "test"]` source requirement
# (delivery_pipeline.py's own `_STEP_SOURCES`) is always satisfied by
# the time `documentation` could ever be reached. See that module's own
# docstring for the full reasoning and why this was chosen over the
# pipeline's other three idle-capability candidates.
#
# Loaded by the already-real, already-existing, previously-unused
# ai_os_kernel.workflow_engine.loader.WorkflowDefinitionLoader — the
# first real consumer of that loader in this codebase (every prior
# WorkflowDefinition in this project, including kernel/bootstrap.py's
# own demo, is constructed directly in Python, for the documented
# reason that no real pack directory existed yet to load one from —
# see bootstrap.py's own comment. One now does.)
#
# A real `git-push` step (added 2026-08-02, `P03-S04-M31-T04`) is now
# this pipeline's new, final step, after `documentation` — the first
# real, end-to-end exercise of the Git Integration Service
# (`P03-S01-M24-T01`) and its ToolInvoker-reachable tools
# (`P03-S04-M31-T04`) through a real workflow, not just a direct
# service/adapter call. Reads `build`'s own real `workingDirectory`/
# `filePath` (delivery_pipeline.py's own `_STEP_SOURCES`) — the
# identical field pair `lint`/`test` already consume. **Genuinely
# no-ops (`pushed: false`) for every current real caller**: the
# `GitPushAgentEntrypoint` this step dispatches to reads
# `AIOS_GIT_REMOTE_URL` (`P03-S01-M24-T02`) as its bare default, unset
# in every environment today, so this step changes nothing about the
# pipeline's existing, proven behavior for the real HTTP route or any
# existing test that does not explicitly configure one. A caller that
# does configure a real `remote_url` (this pack's own end-to-end proof
# test) gets a real commit and push, through the identical Tool
# dispatch path — gated by a real human approval, immediately below.
#
# A real `human_approval` step, `approve-git-push` (added 2026-08-03,
# `P03-S03-M30-T05`), now sits between `documentation` and `git-push` —
# closing R-001's own standing concern that `se.delivery_pipeline` ran
# fully autonomously with no human in the loop before any real,
# external, irreversible action. Reuses the existing Human Approval
# Manager (`P03-S05-M14-T04`/`T05`/`T06`) unchanged: the pipeline
# genuinely pauses (`WorkflowRunOutcome.WAITING_FOR_HUMAN`) the first
# time it reaches this step, and resumes only on a real, attributable,
# RBAC-authorized decision (`approver:approve-git-push` or `admin`) —
# never on a timeout, since nothing anywhere converts one into an
# implied decision (the same permanent hard rule
# `test_human_approval_execution.py` already proves generically, reused
# here unchanged). Declares no `timeout` — an approval to push
# generated code should wait indefinitely for a real human, not
# silently expire. This gates the push itself, for every branch: a
# direct push to a genuinely *protected* branch remains separately,
# permanently, structurally impossible regardless of any approval
# (`GitIntegrationService.push`'s own §5.1 refusal, git_integration.md)
# — this step's own real target is the autonomy gap R-001 names, not a
# bypass path around that structural refusal. Real, disclosed, deferred
# scope, unchanged from `human_approval.py`'s own module docstring: no
# HTTP route exists yet for a real caller to submit a decision against
# a live Kernel process, and the generic multi-instance worker loop
# (`bootstrap.py`) is not wired with this pipeline's own executor set —
# a paused production run resumes today only through the same
# service-layer call this pack's own tests use, exactly as every other
# `human_approval` step in this codebase already discloses.

id: se.delivery_pipeline
name: Software Delivery Pipeline
description: >-
  Requirements Analyst refines the raw ask, Architecture proposes a
  design against that refined analysis, Build implements it, a real
  decision step routes straight to Test (skipping a wasted Lint and
  Code Review invocation) when Build's own write genuinely failed, a
  real Quality Gate blocks on a genuine lint failure, Code Review
  produces real structured findings and a third real Quality Gate
  blocks on a genuine `high` severity finding (FR-045's own bounded
  review-revise loop), Test verifies it, a fourth real Quality Gate
  blocks on a genuine test failure (all bounded-retry from Build once
  before giving up), Documentation records it, a real Human Approval
  Point pauses the pipeline for a real, attributable, authorized
  decision, and Git Push then commits and pushes it through the real
  Git Integration Service when configured — eight real agent steps,
  one real routing decision, one real human approval point, plus four
  real, blocking, retried quality gates, each genuinely consuming the
  previous step's real, persisted output.
version: 1.8.0
trigger: manual

inputs:
  type: object
  properties:
    requirement:
      type: string
      description: >-
        The raw software requirement or ask to design, build, test, and
        document — analyzed and refined by Requirements Analyst before
        Architecture ever sees it.
  required: [requirement]
  additionalProperties: false

outputs:
  type: object
  properties:
    documentationPath:
      type: string
  required: [documentationPath]
  additionalProperties: false

agents:
  - software-engineering/requirements-analyst
  - software-engineering/architecture
  - software-engineering/build
  - software-engineering/lint
  - software-engineering/code-review
  - software-engineering/qa-test
  - software-engineering/documentation
  - software-engineering/git-push

qualityGates:
  - se.build_lint_clean
  - se.code_review_clean
  - se.build_tests_pass

humanApprovalPoints:
  - id: approve-git-push
    name: Approve Git Push
    description: >-
      A human must approve before this pipeline's own generated file is
      committed and pushed through the real Git Integration Service.
      Approving a no-op run (no real remote configured) is harmless;
      approving a real one is this pipeline's one real, external,
      irreversible action.
    context:
      step: git-push
      reads: [build.workingDirectory, build.filePath]
    options: [approve, reject]

retryPolicy:
  maxAttempts: 2
  maxDurationSeconds: 60.0

failureHandling:
  onError: halt

steps:
  - id: requirements-analyst
    type: agent
    agentId: software-engineering/requirements-analyst
    promptId: requirements.analyze
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: architecture
    type: agent
    agentId: software-engineering/architecture
    promptId: architecture.propose_design
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: build
    type: agent
    agentId: software-engineering/build
    promptId: build.write_file
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: route-after-build
    type: decision
    condition:
      sourceStepId: build
      field: written
      equals: true
    branches:
      "true": lint
      "false": test

  - id: lint
    type: agent
    agentId: software-engineering/lint

  - id: quality-gate-lint-clean
    type: quality_gate

  - id: code-review
    type: agent
    agentId: software-engineering/code-review
    promptId: codereview.produce_findings
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: quality-gate-code-review-clean
    type: quality_gate

  - id: test
    type: agent
    agentId: software-engineering/qa-test

  - id: quality-gate-tests-pass
    type: quality_gate

  - id: documentation
    type: agent
    agentId: software-engineering/documentation
    promptId: documentation.record_artifact
    promptVersion: 0.1.0
    modelAlias: coding-strong

  - id: approve-git-push
    type: human_approval

  - id: git-push
    type: agent
    agentId: software-engineering/git-push
