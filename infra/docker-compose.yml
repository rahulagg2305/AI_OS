# Local development topology (docs/11_deployment/deployment_architecture.md
# §5). Profiles keep the footprint proportionate — bring up only what a
# given step needs:
#   core          postgres, redis
#   observability + otel-collector, prometheus, tempo, loki, grafana
#   full          everything
#
# api/worker are not included in any profile yet — no container image
# exists until a later Stage A/B step builds the Dockerfile (so `core`
# and `full` are not literally "everything" the table in
# deployment_architecture.md §5 eventually names, only what exists today).
#
# Usage (from the repository root):
#   docker compose -f infra/docker-compose.yml --env-file .env --profile core up -d
#   docker compose -f infra/docker-compose.yml --env-file .env --profile observability up -d
#
# For the observability profile: the Kernel runs as a local, non-
# containerised dev process (same as today, no image change) — set
# OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (.env.example) so its
# real OTLP/HTTP exporter (P01-S05-M04-T03) reaches this Collector.
#
# Credentials below are local-development placeholders, not managed secrets
# (ADR-0024 secrets backend is separate, later work). Override any of them
# by setting the corresponding variable in your `.env` (see .env.example).

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${AIOS_DB_USER:-aios}
      POSTGRES_PASSWORD: ${AIOS_DB_PASSWORD:-aios_dev_only}
      POSTGRES_DB: ${AIOS_DB_NAME:-aios}
    ports:
      - "${AIOS_DB_PORT:-5432}:5432"
    volumes:
      - aios_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIOS_DB_USER:-aios}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core", "full"]
    ports:
      - "${AIOS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- observability profile (P01-S05-M04-T04) ---
  # ADR-0017's reference backend: OTLP -> Collector -> {Prometheus, Tempo,
  # Loki} -> Grafana. Config files live in infra/observability/ — see each
  # one's own header comment for what it does and, for Loki specifically,
  # the real gap it discloses (no log producer wired to it yet).

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: ["observability", "full"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${AIOS_OTLP_GRPC_PORT:-4317}:4317"
      - "${AIOS_OTLP_HTTP_PORT:-4318}:4318"
      - "${AIOS_OTEL_COLLECTOR_METRICS_PORT:-8889}:8889"
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability", "full"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aios_prometheus_data:/prometheus
    ports:
      - "${AIOS_PROMETHEUS_PORT:-9090}:9090"

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability", "full"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - aios_tempo_data:/var/tempo
    ports:
      - "${AIOS_TEMPO_HTTP_PORT:-3200}:3200"

  loki:
    image: grafana/loki:3.2.1
    profiles: ["observability", "full"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - aios_loki_data:/loki
    ports:
      - "${AIOS_LOKI_PORT:-3100}:3100"

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability", "full"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - aios_grafana_data:/var/lib/grafana
      # Deliberately NOT nested under the read-only provisioning mount
      # above (dashboards.yaml's own comment explains why: a real,
      # discovered "read-only file system" conflict). Nesting under the
      # writable named volume above works, since Docker creates the
      # mount point inside a writable parent before mounting the
      # read-only dashboard JSON onto it.
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${AIOS_GRAFANA_PORT:-3000}:3000"
    # Readiness gate, not decoration (2026-08-12). `docker compose up
    # --wait` — which `testcontainers.compose.DockerCompose.start()`
    # already passes — only waits for services that declare a
    # healthcheck; for one that does not, it returns as soon as the
    # container is *running*. Docker publishes this port immediately, so
    # the docker-proxy accepts a connection and then resets it until
    # Grafana's own HTTP server is genuinely listening. That window is
    # what failed CI run 31624893187 with `[Errno 104] Connection reset
    # by peer`, and the same window locally as `[WinError 10053]` — one
    # cause, two platform spellings. `/api/health` is the endpoint
    # Grafana itself documents as its readiness signal, and the one the
    # compose-profile test asserts on.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Failures inside this window do not count toward `retries` —
      # Grafana runs its own database migrations before serving, and a
      # cold start on a loaded runner genuinely takes longer than one
      # interval.
      start_period: 15s
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  aios_postgres_data:
  aios_prometheus_data:
  aios_tempo_data:
  aios_loki_data:
  aios_grafana_data:
