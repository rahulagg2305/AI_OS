{{- if .Values.serviceAccount.create }}
# ServiceAccount/aios — deployment_architecture.md §6. "Least-privilege
# RBAC" per that document's own wording — no Role/RoleBinding is bound
# to it by this chart's own first cut, since no in-cluster API access
# (beyond the default, unavoidable one every pod gets) has been decided
# anywhere for either role; a real RBAC policy is disclosed, unbuilt
# follow-up in README.md, not fabricated here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-os.serviceAccountName" . }}
  labels:
    {{- include "ai-os.labels" . | nindent 4 }}
{{- end }}
