# PodDisruptionBudget — deployment_architecture.md §6 ("minAvailable: 1
# per role"). One per role, matching the document's own wording exactly.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-os.fullname" . }}-api
  labels:
    {{- include "ai-os.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      aios.role: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-os.fullname" . }}-worker
  labels:
    {{- include "ai-os.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      aios.role: worker
