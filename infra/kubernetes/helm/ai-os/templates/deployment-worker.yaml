# Deployment/aios-worker — deployment_architecture.md §6 ("replicas >= 3
# role=worker"). Runs the real image's own `worker` entry point
# (kernel/src/ai_os_kernel/entrypoints/worker.py) — a genuine,
# continuously-running multi-instance worker loop (P01-S01-M40-T05),
# not a stub.
#
# **No liveness/readiness/startup probes — a real, disclosed gap, not
# an oversight.** deployment_architecture.md §6's own Probes table
# names HTTP paths, but those paths are served only by the `api` role's
# own FastAPI app (kernel/src/ai_os_kernel/entrypoints/api.py); the
# `worker` entry point above runs no HTTP server at all — verified
# directly in its own source, not assumed. Adding a probe against a
# path that does not exist on this role would make every worker pod
# fail its own health check permanently, which is worse than no probe.
# A real worker-specific health signal (e.g. a heartbeat file, or a
# small internal HTTP listener) is unbuilt, disclosed follow-up work —
# see README.md.
#
# **The rootless Podman sidecar (`P07-S01-M40-T01`, opt-in via
# `sandboxSidecar.enabled`) is real too — see `values.yaml`'s own
# extensive docstring for the full, verified design.** When enabled,
# `podFsGroup` makes the shared `sandbox-socket` `emptyDir` volume
# genuinely writable by the sidecar's own non-root user, and the
# `worker` container gets `DOCKER_HOST` pointing at the real socket the
# sidecar exposes on it — `DockerSandbox`'s own `docker.from_env()`
# already reads that variable, no Kernel code change needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-os.fullname" . }}-worker
  labels:
    {{- include "ai-os.labels" . | nindent 4 }}
    aios.role: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      aios.role: worker
  template:
    metadata:
      labels:
        {{- include "ai-os.labels" . | nindent 8 }}
        aios.role: worker
    spec:
      serviceAccountName: {{ include "ai-os.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.sandboxSidecar.enabled }}
      securityContext:
        fsGroup: {{ .Values.sandboxSidecar.gid }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AIOS_ROLE
              value: worker
            - name: AIOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: AIOS_DATABASE_URL
            - name: AIOS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: AIOS_REDIS_URL
            {{- if .Values.sandboxSidecar.enabled }}
            - name: DOCKER_HOST
              value: "unix://{{ .Values.sandboxSidecar.socketPath }}"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-os.fullname" . }}-config
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.sandboxSidecar.enabled }}
          volumeMounts:
            - name: sandbox-socket
              mountPath: {{ dir .Values.sandboxSidecar.socketPath }}
          {{- end }}
        {{- if .Values.sandboxSidecar.enabled }}
        - name: podman-sidecar
          image: "{{ .Values.sandboxSidecar.image.repository }}:{{ .Values.sandboxSidecar.image.tag }}"
          # Real, verified command — see values.yaml's own docstring
          # for exactly what each flag/capability below was confirmed
          # necessary for, against a real local daemon, before being
          # written here.
          command: ["podman"]
          args:
            - --storage-driver
            - vfs
            - system
            - service
            - --time=0
            - "unix://{{ .Values.sandboxSidecar.socketPath }}"
          securityContext:
            runAsUser: {{ .Values.sandboxSidecar.uid }}
            runAsGroup: {{ .Values.sandboxSidecar.gid }}
            runAsNonRoot: true
            allowPrivilegeEscalation: true
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
            seccompProfile:
              type: Unconfined
          resources:
            {{- toYaml .Values.sandboxSidecar.resources | nindent 12 }}
          volumeMounts:
            - name: sandbox-socket
              mountPath: {{ dir .Values.sandboxSidecar.socketPath }}
        {{- end }}
      {{- if .Values.sandboxSidecar.enabled }}
      volumes:
        - name: sandbox-socket
          emptyDir: {}
      {{- end }}
