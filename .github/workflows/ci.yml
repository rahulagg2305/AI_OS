name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Per ADR-0015. Stages are fail-fast in order: lint -> types -> unit ->
# contract -> integration -> security -> build.
#
# `contract`, `security`, `build`, and `frontend` reference code paths
# (tests/contract, tests/security, Dockerfile, dashboard/) that do not
# exist yet, per docs/19_roadmap/feature_inventory.md. Rather than
# deleting those stages — which would silently drop the pipeline shape
# ADR-0015 and test_strategy.md §6 document as the target — each
# not-yet-existing step is individually gated on the path actually
# existing (`hashFiles(...) != ''`), so the stage is a real no-op today
# and starts running for real the moment its prerequisite step lands,
# with no further CI changes required. Steps gated this way are marked
# below.
env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"
  # Never set a real provider key here. Adapter tests use recorded cassettes;
  # the live provider suite is opt-in and runs outside the merge path.
  AIOS_ENV: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  types:
    name: Static types
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # R-010 (found 2026-07-31, fixed same day): this step used to name
      # an explicit path list ("kernel/src kernel/alembic tests") under a
      # comment claiming it mirrored [tool.mypy] files in pyproject.toml
      # "exactly" — it did not. That list has held platform_sdk/src,
      # platform_sdk/tests, capability_packs/software-engineering/src,
      # that pack's tests, and scripts since the Platform SDK and this
      # roadmap tooling were built; none of the five were ever
      # type-checked in CI. The canonical, no-argument invocation reads
      # [tool.mypy] files itself, so this step can never silently drift
      # from that config again — the config is the one place scope is
      # decided. Proven locally at 378 source files.
      - name: mypy --strict
        run: uv run mypy --strict

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: types
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # Coverage (NFR-060) is enforced once, in `integration`, against the
      # combined unit + integration run — not here. ADR-0015 deliberately
      # keeps real SQL persistence code (SqlWorkflowInstanceRepository,
      # SqlWorkflowLeaseRepository, ...) covered only by integration tests
      # against a real Postgres, never by mocks in unit tests, so unit
      # coverage alone never reflects "Kernel test coverage" as NFR-060
      # means it — only unit+integration together do.
      - name: pytest tests/unit
        run: uv run pytest tests/unit -v
      # Real, previously-undiscovered gap (found `P05-S02-M32-T01`,
      # widened to every pack `P05-S02-M32-T02` / R-014): no CI job ever
      # ran any Capability Pack's own tests/ directory — confirmed by
      # reading this file directly, not merely by test count.
      # `capability_packs/*/tests/**` is outside root pyproject's
      # `testpaths = ["tests"]`, so `pytest tests/unit` above never
      # collected it either. **Root cause of the second bug that first
      # blocked widening this to every pack, now fixed**: running the
      # installed `pytest` console-script entry point (what `uv run
      # pytest` and every other step in this file already does) does
      # not add the repo root to `sys.path` the way `python -m pytest`
      # does — so `test_database_agent.py`'s own `from tests.integration.
      # _postgres_fixture import postgres_container` (a real,
      # already-established cross-tree convention this pack's own
      # pyproject.toml comment names) raised `ModuleNotFoundError`,
      # invocation-style-dependent and therefore invisible to whoever
      # last happened to run it via `python -m pytest` instead. Fixed at
      # the root, not per-file: `[tool.pytest.ini_options] pythonpath =
      # ["."]` in `pyproject.toml`, pytest's own invocation-style-
      # independent mechanism — proven locally, all 242 pack tests
      # across all 3 real packs now collect and pass via this exact
      # entry point.
      - name: pytest capability_packs (pack-local tests)
        if: hashFiles('capability_packs/*/tests/**') != ''
        run: uv run pytest capability_packs/*/tests -v

      # The identical R-014 defect, found 2026-08-13 in a second place
      # and fixed the same way. `tools/aios/tests/**` sits outside root
      # `pyproject.toml`'s `testpaths = ["tests"]`, and no step here ever
      # named it — so the CLI's own suite had never run in CI at all,
      # exactly as `capability_packs/*/tests` had not before R-014.
      # Proven locally at the time of adding: 49 tests collect and pass
      # through this exact entry point.
      - name: pytest tools/aios (CLI-local tests)
        if: hashFiles('tools/aios/tests/**') != ''
        run: uv run pytest tools/aios/tests -v

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # Validates every pack manifest against the authoritative JSON Schema,
      # runs the SDK pack contract suite, and enforces the import boundaries
      # that make ADR-0001/0002/0009 real rather than aspirational.
      # Gated: no capability pack has a contract suite to run yet.
      - name: Pack contract suite and Protocol conformance
        if: hashFiles('tests/contract/**') != ''
        run: uv run pytest tests/contract -v
      # Real as of platform_sdk_v1_scope.md step 8: pack_contract_suite
      # check 7 (forbidden imports), applying each pack's own dated,
      # expiring pack_contract_waiver.yaml if one exists. The gate
      # condition is now always true — kept, not simplified to an
      # unconditional step, since the "gated on the file existing"
      # convention is this workflow's own established shape for every
      # not-yet-existing prerequisite, and removing it here would be an
      # inconsistent, unforced style change for a step that still
      # legitimately depends on the file's presence.
      - name: Import boundary check
        if: hashFiles('scripts/check_import_boundaries.py') != ''
        run: uv run python scripts/check_import_boundaries.py
      # Phase R2: the roadmap rollups are generated from the Task tickets.
      # A hand edit to a generated file, or a ticket change that was not
      # regenerated, fails the build here — this is what makes the R1
      # append-only-paragraph pathology structurally impossible rather
      # than merely discouraged.
      - name: Roadmap generated docs are current
        if: hashFiles('scripts/roadmap/generate.py') != ''
        run: uv run python -m scripts.roadmap.generate --check
      # The ticket structural invariants themselves (line/size caps,
      # unique ids, resolvable dependencies, evidence required for
      # done/partial). Without this the guards exist but nothing in CI
      # runs them — the `unit` and `integration` jobs name explicit
      # paths and never picked up `tests/roadmap`.
      - name: Roadmap ticket invariants
        if: hashFiles('tests/roadmap/**') != ''
        run: uv run pytest tests/roadmap -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: contract
    # Defensive fail-fast (added after run 30682840924 hung for 70+
    # minutes with zero step progress and no timeout configured at all
    # — GitHub's own default is 360 minutes, far too long to silently
    # burn on a genuine hang). Raised 20 -> 25 minutes (P01-S05-M04-T04)
    # for the real observability Compose profile's own live-Docker test
    # (test_compose_observability_profile.py) — five real container
    # images (Collector, Prometheus, Tempo, Loki, Grafana), never
    # pulled by this repo's CI before, on top of the existing headroom
    # for the real Postgres testcontainers every other integration test
    # already provisions — while still failing fast enough that a real
    # hang is caught and investigated the same day, not silently
    # consumed for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # Real Postgres via testcontainers — the same approach every test in
      # tests/integration already uses (ADR-0015: transactional atomicity,
      # SKIP LOCKED leasing, and Alembic up/down/up are exactly the
      # behaviours mocks hide). No GitHub Actions `services:` container and
      # no AIOS_DATABASE_URL here: each test module provisions and tears
      # down its own ephemeral container and sets the URL itself. Alembic
      # up/down/up is exercised by tests/integration/persistence/test_migrations.py,
      # not as a separate step.
      - name: pytest tests/unit + tests/integration (coverage-gated, NFR-060)
        run: >
          uv run pytest tests/unit tests/integration -v
          --cov --cov-branch --cov-report=term-missing --cov-fail-under=90
      # Gated: no end-to-end workflow suite exists yet (needs the LLM
      # Gateway's stubbed-response contract first).
      - name: pytest tests/workflow
        if: hashFiles('tests/workflow/**') != ''
        run: uv run pytest tests/workflow -v
      # Real chaos tests (P07-S03-M42-T01) — a sibling of tests/unit/
      # tests/integration, not nested inside either, so the coverage-gated
      # step above never discovers it; needs its own step, the identical
      # `hashFiles` guard shape tests/workflow already establishes. Real
      # Postgres via testcontainers (test_worker_crash_recovery.py) and a
      # real local HTTP server (test_provider_outage_recovery.py) — no
      # Docker-daemon-only dependency, so this runs unconditionally once
      # the directory exists, unlike tests/security's Docker-gated subset.
      - name: pytest tests/chaos
        if: hashFiles('tests/chaos/**') != ''
        run: uv run pytest tests/chaos -v

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      # 30 real per-threat tests (T1-T12), P01-S06-M42-T04. `hashFiles`
      # gate kept as a harmless no-op guard, not because the directory
      # can be empty again.
      - name: Threat-model control tests
        if: hashFiles('tests/security/**') != ''
        run: uv run pytest tests/security -v
      # Real today, scoped to runtime dependencies: `--no-emit-workspace`
      # drops the unpublished local `ai-os-kernel` package itself (pip-audit
      # cannot look up a package that isn't on PyPI — `--strict` would
      # otherwise hard-fail on that lookup, not on an actual vulnerability);
      # `--no-dev` drops dev-only tooling (pytest, mypy, ruff, ...), which
      # never ships in a deployed AI_OS instance and so is out of scope for
      # a *runtime* vulnerability gate.
      - name: Dependency vulnerabilities
        run: |
          uv export --format requirements-txt --no-emit-workspace --no-dev -o "$RUNNER_TEMP/requirements-audit.txt"
          uv run pip-audit --strict -r "$RUNNER_TEMP/requirements-audit.txt"
      # Real today: runs against actual git history.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [integration, security]
    # Gated: no Dockerfile exists yet. The existence check is applied
    # per-step, never as a job-level `if:` — `hashFiles()` is only
    # available once a workspace exists, and a job-level `if:` is
    # evaluated *before* checkout, so GitHub rejects the whole workflow
    # file with "Unrecognized function: 'hashFiles'" (which is exactly
    # what silently kept every job in this file from ever running; see
    # run 30600439059). This matches the per-step gating the contract/
    # integration/security stages above already use.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: hashFiles('Dockerfile') != ''
      # uv sync --frozen inside the Dockerfile fails the build if uv.lock is
      # stale, so an image can never contain unlocked dependencies.
      - name: docker build
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-os:${{ github.sha }}
          # Real, dynamic value (the commit actually being built) —
          # never hardcoded. Deployment_architecture.md §3: "Image is
          # labelled with the Git SHA". No VERSION build-arg here: the
          # Dockerfile's own default is honest about what CI has not
          # been given a real semantic-version source for yet.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    # Gated: no dashboard/ exists yet. The original trigger condition
    # (dashboard-related commits, or any PR) stays at job level, where it
    # is genuinely valid; the *existence* half moved to per-step `if:`
    # for the same reason as the `build` job above — `hashFiles()` is not
    # available in a job-level `if:`, and using it there made GitHub
    # reject this entire workflow file. Once dashboard/ lands, behaviour
    # reverts to exactly the original condition.
    if: >-
      contains(github.event.head_commit.message, 'dashboard') || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('dashboard/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
      # `tsc --noEmit` alone is a real, silent no-op here (found
      # `P06-S03-M39-T02`): the root tsconfig.json is a bare
      # project-references pointer (`"files": []`), so a plain
      # invocation with no `-b` checks zero source files and always
      # exits 0 regardless of any real type error — confirmed directly
      # via `tsc --noEmit --listFiles`. `-b` (build/project-reference
      # mode) is the invocation that actually type-checks `src/`.
      - run: npx tsc -b
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
      - run: npm run lint
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
      - run: npm run test -- --run
        if: hashFiles('dashboard/package.json') != ''
        working-directory: dashboard
      # Fails if the generated client has drifted from the published OpenAPI
      # document (ADR-0018).
      - name: OpenAPI client drift check
        if: hashFiles('dashboard/package.json') != ''
        run: npm run check:api-client
        working-directory: dashboard
