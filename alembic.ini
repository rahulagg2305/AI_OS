[alembic]
# Migration scripts live under the Kernel distribution because workflow
# state is Kernel-owned persistence (ADR-0011). Invoked from the
# repository root (`uv run alembic upgrade head`), matching every other
# documented way of running the Kernel (see kernel/src/ai_os_kernel/bootstrap.py).
script_location = %(here)s/kernel/alembic

# The actual URL comes from AIOS_DATABASE_URL at runtime (env.py) —
# never hardcoded here, and never a file committed to the repository
# (docs/03_architecture/services/configuration_management.md §3.3).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
