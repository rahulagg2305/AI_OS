[project]
name = "ai-os-workspace"
version = "0.1.0"
description = "AI_OS workspace root — orchestrates the member distributions and shared tooling config. Not published."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Depending on every real workspace member here is what makes a plain
# `uv sync` (no flags) install the whole workspace into the shared venv.
# Add each pack/service distribution to this list as it is scaffolded.
dependencies = [
    "ai-os-kernel",
    "ai-os-sdk",
    "ai-os-cli",
    "ai-os-pack-software-engineering",
    "ai-os-pack-benchmarking",
    "ai-os-pack-project-intelligence",
]

# This root project is never built or installed as a package (ADR-0009,
# ADR-0010). It exists only to declare the uv workspace and to hold tool
# configuration ([tool.ruff], [tool.mypy], [tool.pytest.ini_options]) that
# every member shares, so each package does not repeat it.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
    "types-pyyaml>=6.0,<7.0",
    "types-jsonschema>=4.23,<5.0",
    "testcontainers[postgres]>=4.8,<5.0",
    "pip-audit>=2.7,<3.0",
]

# --- Workspace members -----------------------------------------------------
# Each member is its own PEP 621 distribution with its own pyproject.toml
# (ADR-0009). A member is added to this list only once its pyproject.toml
# exists — `uv sync` fails on a listed path with no manifest, so this list
# is deliberately behind the actual scaffolding, not ahead of it.
#
# platform_sdk (ai-os-sdk) was scaffolded 2026-07-28
# (platform_sdk_v1_scope.md step 1) — packaging only, no Protocols or
# models yet; see platform_sdk/README.md for what each future step adds.
#
# Still planned, not yet scaffolded: platform_services (ai-os-services).
# capability_packs/software-engineering is the first pack scaffolded
# this way — see its own pyproject.toml for why it depends on
# ai-os-kernel directly (a documented, temporary compromise:
# platform_sdk_v1_scope.md steps 9–14 migrate it onto ai-os-sdk instead).
# capability_packs/benchmarking was scaffolded `P04-S03-M34-T01` — its
# own pyproject.toml has no ai-os-kernel dependency at all, real from
# its very first commit (no such compromise ever existed for it).
# capability_packs/project_intelligence was scaffolded `P05-S02-M32-T01`
# — the same real-from-first-commit rule as benchmarking; depends on
# ai-os-sdk (for TrustTier) plus pydantic, never ai-os-kernel.
# tools/aios (ai-os-cli) was scaffolded `P06-S04-M38-T01` — a pure
# client of the platform API (ADR-0014); no ai-os-kernel or ai-os-sdk
# dependency at all, real from its first commit.
#
# capability_packs/voice_jarvis was attempted `P06-S06-M33-T01` as a
# pure HTTP-client pack (the identical shape tools/aios uses) and
# rejected the same day: `pack_contract_suite` check 7
# (`platform_sdk.md` §9/§10) forbids ANY direct HTTP client import in
# pack code, full stop — including a call to the platform's own
# Kernel API, not only a third-party provider (see
# `ai_os_sdk.testing.forbidden_imports`'s own module docstring, "sixth
# category"). The real, first increment instead lives at
# `ai_os_kernel.voice_jarvis` — the identical "build inside the
# Kernel, not a separate package" precedent Notification Service and
# the Speech Gateway itself already establish, and moves onto real
# SDK Protocols once one exists for this.
[tool.uv.workspace]
members = [
    "kernel",
    "platform_sdk",
    "tools/aios",
    "capability_packs/software-engineering",
    "capability_packs/benchmarking",
    "capability_packs/project_intelligence",
]

[tool.uv.sources]
ai-os-kernel = { workspace = true }
ai-os-sdk = { workspace = true }
ai-os-cli = { workspace = true }
ai-os-pack-software-engineering = { workspace = true }
ai-os-pack-benchmarking = { workspace = true }
ai-os-pack-project-intelligence = { workspace = true }

# --- Shared tooling ---------------------------------------------------------
# ADR-0015: pytest + testcontainers, ruff, mypy --strict, GitHub Actions.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["kernel/src", "platform_sdk/src", "tools/aios/src", "capability_packs/software-engineering/src", "capability_packs/benchmarking/src", "capability_packs/project_intelligence/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM"]
# S101 (assert) is expected and required in tests; pytest relies on plain
# `assert` and stripping it under `-O` is not a supported run mode here.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"capability_packs/*/tests/**" = ["S101"]
"platform_sdk/tests/**" = ["S101"]
"tools/aios/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ai_os_kernel", "ai_os_sdk", "ai_os_cli", "ai_os_pack_software_engineering", "ai_os_pack_benchmarking", "ai_os_pack_project_intelligence"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# Only real code is checked. Empty component stubs (docstring-only
# __init__.py files awaiting later Implementation Roadmap stages) still
# type-check cleanly since they contain no statements.
files = ["kernel/src", "kernel/alembic", "tests", "platform_sdk/src", "platform_sdk/tests", "tools/aios/src", "tools/aios/tests", "capability_packs/software-engineering/src", "capability_packs/software-engineering/tests", "capability_packs/benchmarking/src", "capability_packs/benchmarking/tests", "capability_packs/project_intelligence/src", "capability_packs/project_intelligence/tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# docker-py ships no inline types and no py.typed marker, and no
# maintained third-party stub package exists for it — the identical
# "declare the gap, do not silently suppress project-wide" treatment
# this file already avoids by scoping every override to one module.
module = "docker.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
# R-014: the repo root is on `sys.path` when running `python -m pytest`
# (which inserts cwd at sys.path[0]) but *not* when running the
# installed `pytest` console-script entry point directly — the exact
# invocation every CI step and this project's own tooling actually
# uses. Without this, any capability-pack test importing the top-level
# `tests` package (`tests.integration._postgres_fixture`, a real,
# already-established convention — see that pack's own pyproject.toml
# comment) fails to collect at all with `ModuleNotFoundError: No
# module named 'tests'`, invocation-style-dependent and therefore
# invisible locally to whoever last happened to run it correctly.
# `pythonpath` is pytest's own explicit, invocation-style-independent
# fix — it inserts the given path(s) regardless of which entry point
# launched pytest.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["ai_os_kernel"]

[tool.coverage.report]
skip_empty = true
